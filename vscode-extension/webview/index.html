<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src __CSP_SOURCE__ https: data:; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__';" />
  <title>CodeSquareAgent</title>
  <style>
    :root {
      --bg: var(--vscode-sideBar-background, #0d1117);
      --fg: var(--vscode-foreground, #c9d1d9);
      --dim: var(--vscode-descriptionForeground, #b3bdc9);
      --muted: rgba(180, 190, 205, 0.55);
      --line: var(--vscode-widget-border, rgba(255, 255, 255, 0.10));
      --overlay: rgba(255, 255, 255, 0.04);
      --input-bg: var(--vscode-input-background, rgba(255, 255, 255, 0.05));
      --code-bg: #0b0e14;
      --primary: #7aa2f7;
      --green: #3fb950;
      --mint: #56d364;
      --cyan: #39c5cf;
      --red: #f85149;
      --mono: var(--vscode-editor-font-family, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
      --ui: var(--vscode-font-family, -apple-system, Segoe UI, sans-serif);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--ui);
      font-size: 13px;
      color: var(--fg);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    button { font-family: inherit; cursor: pointer; }
    .hidden { display: none !important; }

    /* ---------- login ---------- */
    #login {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }
    #login p { color: var(--dim); font-family: var(--mono); font-size: 12px; }
    #login button {
      background: rgba(122, 162, 247, 0.15);
      color: var(--primary);
      border: 1px solid rgba(122, 162, 247, 0.4);
      border-radius: 8px;
      padding: 8px 22px;
      font-size: 13px;
    }
    #login button:hover { background: rgba(122, 162, 247, 0.25); }
    #login-form { width: 100%; max-width: 230px; display: flex; flex-direction: column; gap: 6px; }
    #login-form input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--line);
      color: var(--fg);
      border-radius: 6px;
      padding: 8px;
      font-family: var(--mono);
      font-size: 12px;
    }
    #login-form input:focus { outline: none; border-color: rgba(122, 162, 247, 0.5); }

    /* ---------- header ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(122, 162, 247, 0.2);
      background: rgba(255, 255, 255, 0.03);
    }
    .avatar {
      width: 30px; height: 30px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      color: #0b0e14;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-weight: 700; font-size: 15px;
    }
    header .title { flex: 1; min-width: 0; }
    header .title .name {
      font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--fg);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    header .title .name .p { color: var(--mint); }
    header .title .status {
      font-family: var(--mono); font-size: 11px; color: var(--green);
      display: flex; align-items: center; gap: 6px; margin-top: 1px;
    }
    header .title .status .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--green);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .icon-btn {
      border: 1px solid var(--line);
      background: var(--overlay);
      color: var(--dim);
      border-radius: 7px;
      padding: 5px 9px;
      font-family: var(--mono);
      font-size: 11px;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .icon-btn:hover { color: var(--primary); border-color: rgba(122, 162, 247, 0.4); }

    /* ---------- messages ---------- */
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .row.agent, .row.sys { justify-content: flex-start; }

    .bubble {
      max-width: 88%;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(122, 162, 247, 0.14);
      color: var(--primary);
      border: 1px solid rgba(122, 162, 247, 0.3);
    }
    .bubble .p { color: var(--mint); font-weight: 700; user-select: none; }

    .agent-wrap, .sys-wrap { width: 100%; }
    .rlabel {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.18em; margin-bottom: 6px;
    }
    .rlabel.ai { color: var(--cyan); }
    .rlabel.sys { color: var(--muted); }
    .rlabel .d { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .sys-wrap .inner {
      border: 1px solid var(--line);
      background: var(--overlay);
      border-radius: 8px;
      padding: 10px 14px;
    }

    /* ---------- markdown ---------- */
    .md { font-size: 13px; line-height: 1.6; color: var(--dim); }
    .md > * + * { margin-top: 8px; }
    .md p { line-height: 1.6; }
    .md strong { color: var(--fg); font-weight: 600; }
    .md a { color: var(--primary); text-decoration: underline; }
    .md code.ic {
      font-family: var(--mono); font-size: 0.85em;
      padding: 1px 5px; border-radius: 4px;
      background: rgba(255, 255, 255, 0.08); color: var(--cyan);
    }
    .md .mdh { color: var(--fg); font-weight: 700; }
    .md .mdh1 { font-size: 15px; margin-top: 12px; }
    .md .mdh2 { font-size: 13.5px; margin-top: 12px; }
    .md .mdh3 { font-size: 13px; margin-top: 10px; }
    .md .mdl { padding-left: 20px; }
    .md .mdl li { margin: 3px 0; line-height: 1.55; }
    .md .mdl .mdl { margin-top: 3px; }
    .md .cb {
      border: 1px solid var(--line);
      background: var(--code-bg);
      border-radius: 8px;
      overflow: hidden;
      margin: 8px 0;
    }
    .md .cb-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }
    .md .cb-lang { font-family: var(--mono); font-size: 10px; color: var(--muted); }
    .md .cb-copy {
      font-family: var(--mono); font-size: 10px; color: var(--muted);
      background: none; border: none;
    }
    .md .cb-copy:hover { color: var(--fg); }
    .md .cb pre { margin: 0; padding: 10px; overflow-x: auto; }
    .md .cb code {
      font-family: var(--mono); font-size: 12px; line-height: 1.5;
      color: var(--fg); white-space: pre;
    }
    .caret {
      display: inline-block; width: 6px; height: 14px;
      margin-left: 2px; vertical-align: middle;
      background: rgba(57, 197, 207, 0.7);
      animation: blink 1s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---------- tool card ---------- */
    .tool-card { border: 1px solid var(--line); background: var(--code-bg); border-radius: 8px; padding: 12px; }
    .tool-card .th { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 13px; margin-bottom: 8px; }
    .tool-card .tp { color: var(--primary); font-family: var(--mono); font-size: 12px; }
    .tool-card .tc {
      background: var(--bg); border-radius: 4px; padding: 8px;
      font-family: var(--mono); font-size: 12px; white-space: pre;
      max-height: 200px; overflow: auto; margin-bottom: 8px;
    }
    .tool-card .ta { display: flex; gap: 8px; justify-content: flex-end; }
    .tool-card .ta button { padding: 5px 14px; border-radius: 5px; border: none; font-size: 12px; }
    .tool-card .accept { background: var(--green); color: #06210f; font-weight: 600; }
    .tool-card .reject { background: transparent; color: var(--dim); border: 1px solid var(--line) !important; }

    /* ---------- composer ---------- */
    #composer { border-top: 1px solid var(--line); padding: 12px; position: relative; }
    .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .quick button {
      font-family: var(--mono); font-size: 11px; color: var(--dim);
      background: var(--overlay); border: 1px solid var(--line);
      border-radius: 6px; padding: 4px 9px;
    }
    .quick button:hover { color: var(--primary); border-color: rgba(122, 162, 247, 0.4); }
    .quick button .s { color: var(--green); user-select: none; }
    .quick button:disabled { opacity: 0.4; cursor: default; }

    #slash-menu {
      position: absolute; left: 12px; right: 12px; bottom: 100%;
      margin-bottom: 8px; background: var(--code-bg);
      border: 1px solid var(--line); border-radius: 8px; overflow: hidden; z-index: 20;
    }
    #slash-menu .sh {
      padding: 5px 12px; border-bottom: 1px solid var(--line);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--muted);
    }
    #slash-menu .si {
      width: 100%; display: flex; align-items: baseline; gap: 8px;
      padding: 7px 12px; text-align: left; background: none; border: none;
    }
    #slash-menu .si.active { background: rgba(122, 162, 247, 0.12); }
    #slash-menu .si .n { font-family: var(--mono); font-size: 13px; color: var(--primary); }
    #slash-menu .si .dsc { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    #slash-menu .sf {
      padding: 5px 12px; border-top: 1px solid var(--line);
      font-family: var(--mono); font-size: 10px; color: var(--muted);
    }

    form#f {
      background: var(--overlay);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: border-color 0.15s;
    }
    form#f.focus { border-color: rgba(122, 162, 247, 0.5); }
    .frow1 { display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px 4px; }
    .frow1 .s { color: var(--green); font-family: var(--mono); font-size: 13px; line-height: 1.55; user-select: none; }
    #input {
      flex: 1; resize: none; background: transparent; border: none; outline: none;
      color: var(--fg); font-family: var(--mono); font-size: 13px; line-height: 1.55;
      max-height: 200px;
    }
    #input::placeholder { color: var(--muted); }
    .frow2 { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-top: 1px solid var(--line); }
    .frow2 .spacer { flex: 1; }
    .frow2 .hint { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-right: 4px; }
    .frow2 .cmd-btn {
      height: 28px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--line); background: var(--overlay);
      border-radius: 7px; font-family: var(--mono); font-size: 12px; color: var(--dim);
    }
    .frow2 .cmd-btn:hover { color: var(--primary); border-color: rgba(122, 162, 247, 0.4); }
    .frow2 .run {
      height: 28px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px;
      background: rgba(122, 162, 247, 0.15); color: var(--primary);
      border: 1px solid rgba(122, 162, 247, 0.4); border-radius: 7px;
      font-family: var(--mono); font-size: 12px;
    }
    .frow2 .run:hover:not(:disabled) { background: rgba(122, 162, 247, 0.25); }
    .frow2 .run:disabled { opacity: 0.4; cursor: default; }
    #foot { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 8px; }
    #foot b { color: var(--primary); font-weight: 400; cursor: pointer; }
    #foot b:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- ================= LOGIN ================= -->
  <div id="login">
    <p>Sign in to CodeSquareAgent</p>
    <button id="login-btn" type="button">Login</button>
    <form id="login-form" class="hidden">
      <input id="login-email" type="email" placeholder="Email" required />
      <input id="login-password" type="password" placeholder="Password" required />
      <button type="submit" style="background:rgba(122,162,247,0.15);color:#7aa2f7;border:1px solid rgba(122,162,247,0.4);border-radius:6px;padding:8px;">Sign in</button>
    </form>
  </div>

  <!-- ================= CHAT ================= -->
  <div id="chat" class="hidden" style="flex:1; display:flex; flex-direction:column; min-height:0;">
    <header>
      <div class="avatar">&#10095;</div>
      <div class="title">
        <div class="name"><span class="p">&#10095;&nbsp;</span>codesquare_agent --live</div>
        <div class="status"><span class="dot"></span> ready for input</div>
      </div>
      <button class="icon-btn" id="new-chat" type="button">+ new</button>
    </header>

    <div id="messages"></div>

    <div id="composer">
      <div id="slash-menu" class="hidden"></div>

      <div class="quick" id="quick"></div>

      <form id="f">
        <div class="frow1">
          <span class="s">$</span>
          <textarea id="input" rows="1" placeholder="ask, paste an error, or type / for commands&#8230;"></textarea>
        </div>
        <div class="frow2">
          <button type="button" class="cmd-btn" id="cmd-btn">/ <span>commands</span></button>
          <span class="spacer"></span>
          <span class="hint">Shift+Enter = newline</span>
          <button type="submit" class="run" id="run">&#10148; run</button>
        </div>
      </form>

      <p id="foot">Try <b data-cmd="/session">/session</b> <b data-cmd="/new">/new</b> <b data-cmd="/usage">/usage</b></p>
    </div>
  </div>

  <script nonce="__NONCE__">
    const vscode = acquireVsCodeApi();

    const $ = (id) => document.getElementById(id);
    const loginView = $("login");
    const chatView = $("chat");
    const loginBtn = $("login-btn");
    const loginForm = $("login-form");
    const messagesEl = $("messages");
    const inputEl = $("input");
    const formEl = $("f");
    const runBtn = $("run");
    const slashMenu = $("slash-menu");
    const quickEl = $("quick");

    let loading = false;
    let cur = null;          // { wrap, body, raw } for the streaming agent message
    let menuIdx = 0;
    let menuItems = [];

    /* -------------------- quick actions -------------------- */
    const QUICK = [
      { label: "Give an example", send: "Show me a short, complete example." },
      { label: "Fix my code", prefill: "Fix this — here's the code and the error:\n\n" },
      { label: "Explain more", send: "Can you explain that in more detail, with a code sample?" },
    ];
    QUICK.forEach((q) => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="s">$ </span>' + escHtml(q.label);
      b.addEventListener("click", () => {
        if (loading) return;
        if (q.send) { submit(q.send); }
        else { inputEl.value = q.prefill || ""; inputEl.focus(); grow(); }
      });
      quickEl.appendChild(b);
    });

    /* -------------------- slash commands -------------------- */
    const SLASH = [
      { name: "session", desc: "Past chats (not in panel yet)", aliases: ["sessions", "resume", "history"] },
      { name: "new", desc: "Start a fresh chat", aliases: ["clear", "reset"] },
      { name: "usage", desc: "Show AI token usage" },
      { name: "help", desc: "List these commands" },
    ];
    const findSlash = (n) => SLASH.find((c) => c.name === n || (c.aliases || []).includes(n));

    function runSlash(raw) {
      const parts = raw.slice(1).trim().split(/\s+/);
      const cmd = (parts[0] || "").toLowerCase();
      const def = findSlash(cmd);
      setInput("");
      hideMenu();
      if (!def) { addSys("Unknown command `/" + cmd + "`. Type `/help` for the list."); return; }
      if (def.name === "new") { vscode.postMessage({ type: "newChat" }); return; }
      if (def.name === "usage") { vscode.postMessage({ type: "usage" }); return; }
      if (def.name === "help") {
        addSys("Commands:\n" + SLASH.map((c) => "- `/" + c.name + "` — " + c.desc).join("\n"));
        return;
      }
      if (def.name === "session") {
        addSys("Saved chat history isn't in the VS Code panel yet — use `/new` to start fresh.");
        return;
      }
    }

    function updateMenu() {
      const m = /^\/(\S*)$/.exec(inputEl.value);
      if (!m) { hideMenu(); return; }
      const q = m[1].toLowerCase();
      menuItems = SLASH.filter((c) => c.name.startsWith(q));
      if (!menuItems.length) { hideMenu(); return; }
      if (menuIdx >= menuItems.length) menuIdx = 0;
      slashMenu.innerHTML =
        '<div class="sh">// commands</div>' +
        menuItems.map((c, i) =>
          '<button type="button" class="si ' + (i === menuIdx ? "active" : "") + '" data-i="' + i + '">' +
          '<span class="n">/' + escHtml(c.name) + '</span>' +
          '<span class="dsc">' + escHtml(c.desc) + '</span></button>'
        ).join("") +
        '<div class="sf">↑↓ select · Tab complete · ↵ run</div>';
      slashMenu.querySelectorAll(".si").forEach((el) => {
        el.addEventListener("mouseenter", () => { menuIdx = +el.dataset.i; paintMenu(); });
        el.addEventListener("click", () => runSlash("/" + menuItems[+el.dataset.i].name));
      });
      slashMenu.classList.remove("hidden");
    }
    function paintMenu() {
      slashMenu.querySelectorAll(".si").forEach((el, i) => el.classList.toggle("active", i === menuIdx));
    }
    function hideMenu() { slashMenu.classList.add("hidden"); menuItems = []; menuIdx = 0; }

    /* -------------------- input handling -------------------- */
    function setInput(v) { inputEl.value = v; grow(); }
    function grow() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
    }
    inputEl.addEventListener("input", () => { grow(); updateMenu(); });
    formEl.addEventListener("focusin", () => formEl.classList.add("focus"));
    formEl.addEventListener("focusout", () => formEl.classList.remove("focus"));

    inputEl.addEventListener("keydown", (e) => {
      if (menuItems.length) {
        if (e.key === "ArrowDown") { e.preventDefault(); menuIdx = (menuIdx + 1) % menuItems.length; paintMenu(); return; }
        if (e.key === "ArrowUp") { e.preventDefault(); menuIdx = (menuIdx - 1 + menuItems.length) % menuItems.length; paintMenu(); return; }
        if (e.key === "Tab") { e.preventDefault(); setInput("/" + menuItems[menuIdx].name + " "); hideMenu(); return; }
        if (e.key === "Escape") { e.preventDefault(); setInput(""); hideMenu(); return; }
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); runSlash("/" + menuItems[menuIdx].name); return; }
      }
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(inputEl.value); }
    });

    formEl.addEventListener("submit", (e) => { e.preventDefault(); submit(inputEl.value); });
    $("cmd-btn").addEventListener("click", () => {
      if (!inputEl.value.startsWith("/")) setInput("/");
      inputEl.focus(); updateMenu();
    });
    $("new-chat").addEventListener("click", () => vscode.postMessage({ type: "newChat" }));
    $("foot").addEventListener("click", (e) => {
      const c = e.target && e.target.dataset && e.target.dataset.cmd;
      if (c) runSlash(c);
    });

    loginBtn.addEventListener("click", (e) => { e.preventDefault(); vscode.postMessage({ type: "login" }); });
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      vscode.postMessage({ type: "loginSubmit", email: $("login-email").value, password: $("login-password").value });
    });

    function submit(text) {
      const msg = (text || "").trim();
      if (!msg || loading) return;
      if (msg.startsWith("/")) { runSlash(msg); return; }
      addUser(msg);
      setInput("");
      hideMenu();
      setLoading(true);
      vscode.postMessage({ type: "sendMessage", text: msg });
    }
    function setLoading(v) {
      loading = v;
      runBtn.disabled = v;
      inputEl.disabled = v;
      quickEl.querySelectorAll("button").forEach((b) => (b.disabled = v));
    }

    /* -------------------- message rendering -------------------- */
    function scroll() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    function addUser(text) {
      const row = document.createElement("div");
      row.className = "row user";
      const b = document.createElement("div");
      b.className = "bubble";
      b.innerHTML = '<span class="p">❯&nbsp;</span>' + escHtml(text);
      row.appendChild(b);
      messagesEl.appendChild(row);
      scroll();
    }

    function addSys(md) {
      const row = document.createElement("div");
      row.className = "row sys";
      const wrap = document.createElement("div");
      wrap.className = "sys-wrap";
      wrap.innerHTML = '<div class="rlabel sys"><span class="d"></span> system</div>';
      const inner = document.createElement("div");
      inner.className = "inner";
      inner.appendChild(renderMarkdown(md));
      wrap.appendChild(inner);
      row.appendChild(wrap);
      messagesEl.appendChild(row);
      scroll();
    }

    function addAgent() {
      const row = document.createElement("div");
      row.className = "row agent";
      const wrap = document.createElement("div");
      wrap.className = "agent-wrap";
      wrap.innerHTML = '<div class="rlabel ai"><span class="d"></span> codesquare_agent</div>';
      const body = document.createElement("div");
      wrap.appendChild(body);
      row.appendChild(wrap);
      messagesEl.appendChild(row);
      scroll();
      return { wrap, body, raw: "" };
    }
    function paintAgent(streaming) {
      if (!cur) return;
      cur.body.innerHTML = "";
      cur.body.appendChild(renderMarkdown(cur.raw));
      if (streaming) {
        const c = document.createElement("span");
        c.className = "caret";
        cur.body.appendChild(c);
      }
      scroll();
    }

    function addToolCard(tc) {
      const card = document.createElement("div");
      card.className = "tool-card";
      const label = tc.tool === "create_file" ? "Create File" : "Edit File";
      const content = tc.content || tc.new_text || "";
      card.innerHTML =
        '<div class="th"><span>' + escHtml(label) + '</span><span class="tp">' + escHtml(tc.path || "") + '</span></div>' +
        '<div class="tc">' + escHtml(content).slice(0, 2000) + '</div>' +
        '<div class="ta"><button class="reject">Cancel</button><button class="accept">Accept</button></div>';
      card.querySelector(".accept").addEventListener("click", () => {
        vscode.postMessage({ type: "acceptTool", tool: tc });
        const a = card.querySelector(".accept");
        a.disabled = true; a.textContent = "Applying…";
      });
      card.querySelector(".reject").addEventListener("click", () => {
        vscode.postMessage({ type: "rejectTool" });
        card.remove();
      });
      messagesEl.appendChild(card);
      scroll();
    }

    function addSuggestions(list) {
      if (!list || !list.length) return;
      const div = document.createElement("div");
      div.className = "quick";
      list.forEach((s) => {
        const b = document.createElement("button");
        b.type = "button";
        b.innerHTML = '<span class="s">$ </span>' + escHtml(s);
        b.addEventListener("click", () => submit(s));
        div.appendChild(b);
      });
      messagesEl.appendChild(div);
      scroll();
    }

    function greeting() {
      cur = null;
      const g = addAgent();
      g.raw = "Hi — I'm CodeSquareAgent. Ask a question, paste an error, or share broken code and I'll help you fix it. I can write full examples too.";
      g.body.appendChild(renderMarkdown(g.raw));
      scroll();
    }

    /* -------------------- tiny markdown -------------------- */
    function escHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function safeHref(u) {
      u = String(u || "").trim();
      if (/^(\/|#|\.|\?)/.test(u)) return u;
      if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
      return null;
    }
    function inlineHTML(text) {
      const re = /(\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\(([^)]+)\))/;
      let rest = String(text), out = "";
      while (rest) {
        const m = rest.match(re);
        if (!m) { out += escHtml(rest); break; }
        if (m.index > 0) out += escHtml(rest.slice(0, m.index));
        if (m[2] != null) out += "<strong>" + escHtml(m[2]) + "</strong>";
        else if (m[3] != null) out += '<code class="ic">' + escHtml(m[3]) + "</code>";
        else {
          const h = safeHref(m[5]);
          out += h
            ? '<a href="' + escHtml(h) + '" target="_blank" rel="noreferrer noopener nofollow">' + escHtml(m[4]) + "</a>"
            : '<span title="blocked link">' + escHtml(m[4]) + "</span>";
        }
        rest = rest.slice(m.index + m[0].length);
      }
      return out;
    }
    function codeBlock(lang, body) {
      const box = document.createElement("div");
      box.className = "cb";
      const bar = document.createElement("div");
      bar.className = "cb-bar";
      const l = document.createElement("span");
      l.className = "cb-lang";
      l.textContent = lang || "code";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cb-copy";
      btn.textContent = "copy";
      btn.addEventListener("click", () => {
        const done = () => { btn.textContent = "copied"; setTimeout(() => (btn.textContent = "copy"), 1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(body).then(done, done);
        } else {
          const ta = document.createElement("textarea");
          ta.value = body; document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); } catch (e) {}
          ta.remove(); done();
        }
      });
      bar.appendChild(l); bar.appendChild(btn);
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.textContent = body;
      pre.appendChild(code);
      box.appendChild(bar); box.appendChild(pre);
      return box;
    }
    function heading(level, text) {
      const tag = level <= 1 ? "h3" : level === 2 ? "h4" : "h5";
      const el = document.createElement(tag);
      el.className = "mdh mdh" + Math.min(3, level);
      el.innerHTML = inlineHTML(text);
      return el;
    }
    const BULLET = /^[\t ]*(?:[-*]|\d+[.)])\s+/;
    function buildList(lines) {
      const rows = lines.map((raw) => {
        const ind = (raw.match(/^[\t ]*/)[0] || "").replace(/\t/g, "  ").length;
        const mm = raw.match(/^[\t ]*([-*]|\d+[.)])\s+([\s\S]*)$/) || [null, "-", raw.trim()];
        return { ind: ind, ordered: /\d/.test(mm[1]), text: mm[2].trim() };
      });
      const base = Math.min.apply(null, rows.map((r) => r.ind));
      const root = document.createElement(rows[0].ordered ? "ol" : "ul");
      root.className = "mdl";
      let curLi = null, sub = null;
      for (const r of rows) {
        if (r.ind > base && curLi) {
          if (!sub) { sub = document.createElement(r.ordered ? "ol" : "ul"); sub.className = "mdl"; curLi.appendChild(sub); }
          const li = document.createElement("li");
          li.innerHTML = inlineHTML(r.text);
          sub.appendChild(li);
        } else {
          sub = null;
          curLi = document.createElement("li");
          curLi.innerHTML = inlineHTML(r.text);
          root.appendChild(curLi);
        }
      }
      return root;
    }
    function renderProse(wrap, text) {
      const raw = String(text).replace(/\r\n?/g, "\n").split("\n");
      const isB = (s) => /^[\t ]*(?:[-*]|\d+[.)])\s/.test(s || "");
      const kept = raw.filter((l, i) => !(l.trim() === "" && isB(raw[i - 1]) && isB(raw[i + 1])));
      const blocks = kept.join("\n").trim().split(/\n{2,}/).filter(Boolean);
      for (const b of blocks) {
        const lines = b.split("\n");
        let para = [], list = [];
        const flushP = () => {
          if (para.length) {
            const p = document.createElement("p");
            p.innerHTML = inlineHTML(para.join(" "));
            wrap.appendChild(p);
            para = [];
          }
        };
        const flushL = () => {
          if (list.length >= 2) wrap.appendChild(buildList(list));
          else if (list.length === 1) { para.push(list[0].replace(BULLET, "")); flushP(); }
          list = [];
        };
        for (const line of lines) {
          const h = line.match(/^(#{1,6})\s+(.*\S)\s*#*\s*$/);
          const bh = line.match(/^\*\*(.+?)\*\*:?\s*$/);
          if (h) { flushP(); flushL(); wrap.appendChild(heading(h[1].length, h[2])); }
          else if (bh) { flushP(); flushL(); wrap.appendChild(heading(3, bh[1])); }
          else if (BULLET.test(line)) { flushP(); list.push(line); }
          else if (list.length && /^[\t ]{2,}\S/.test(line)) { list[list.length - 1] += " " + line.trim(); }
          else if (line.trim()) { flushL(); para.push(line); }
        }
        flushP(); flushL();
      }
    }
    function renderMarkdown(src) {
      const wrap = document.createElement("div");
      wrap.className = "md";
      src = String(src || "");
      const parts = [];
      const fence = /```(\w+)?\n?([\s\S]*?)```/g;
      let last = 0, m;
      while ((m = fence.exec(src)) !== null) {
        if (m.index > last) parts.push({ t: "p", b: src.slice(last, m.index) });
        parts.push({ t: "c", lang: m[1] || "", b: m[2].replace(/\n$/, "") });
        last = m.index + m[0].length;
      }
      if (last < src.length) {
        const tail = src.slice(last);
        const open = tail.match(/```(\w+)?\n?/);
        if (open) {
          if (open.index > 0) parts.push({ t: "p", b: tail.slice(0, open.index) });
          parts.push({ t: "c", lang: open[1] || "", b: tail.slice(open.index + open[0].length) });
        } else {
          parts.push({ t: "p", b: tail });
        }
      }
      if (!parts.length) parts.push({ t: "p", b: src });
      for (const p of parts) {
        if (p.t === "c") wrap.appendChild(codeBlock(p.lang, p.b));
        else renderProse(wrap, p.b);
      }
      return wrap;
    }

    /* -------------------- messages from the extension -------------------- */
    window.addEventListener("message", (event) => {
      const msg = event.data;
      switch (msg.type) {
        case "init":
        case "loginSuccess":
          if (msg.type === "loginSuccess" || msg.loggedIn) {
            loginView.classList.add("hidden");
            chatView.classList.remove("hidden");
            if (!messagesEl.children.length) greeting();
            if (msg.user && msg.user.email) addSys("Logged in as " + msg.user.email);
          }
          break;
        case "loginRequired":
          setLoading(false);
          addSys("Please log in first.");
          break;
        case "clearChat":
          messagesEl.innerHTML = "";
          cur = null;
          setLoading(false);
          greeting();
          addSys("New chat started");
          break;
        case "streamStart":
          setLoading(true);
          cur = addAgent();
          paintAgent(true);
          break;
        case "streamToken":
          if (cur) { cur.raw += msg.token; paintAgent(true); }
          break;
        case "streamDone":
          setLoading(false);
          if (cur) { cur.raw = msg.response || cur.raw; paintAgent(false); cur = null; }
          if (msg.toolCall) addToolCard(msg.toolCall);
          if (msg.suggestions) addSuggestions(msg.suggestions);
          inputEl.focus();
          break;
        case "streamError":
          setLoading(false);
          if (cur) { paintAgent(false); cur = null; }
          addSys("Error: " + msg.error);
          break;
        case "sysMessage":
          setLoading(false);
          addSys(msg.content || "");
          break;
        case "toolResult":
          addSys(msg.message || "");
          break;
        case "toolRejected":
          break;
      }
    });
  </script>
</body>
